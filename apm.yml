name: android-kvm
version: 0.1.0
description: Rust-first USB Android software KVM backed by scrcpy
author: DivitMittal
target:
  - claude
  - codex
  - opencode
type: instructions

dependencies:
  mcp:
    - name: serena
      registry: false
      transport: stdio
      command: uvx
      args:
        - --from
        - git+https://github.com/oraios/serena
        - serena
        - start-mcp-server
        - --context
        - claude-code
        - --project
        - ~/Projects/hid/android-kvm
